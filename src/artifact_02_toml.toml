[package]
name = "castle_sovereign_realm"
version = "0.1.0"
description = "CastleDAO Sovereign Territory Control & Dynamic Staking Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "castle_sovereign_realm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "mint"] }
solana-program = "=1.18.26"